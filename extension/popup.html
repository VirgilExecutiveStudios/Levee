<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>EdTech Verifier</title>
    <style>
        body { width: 280px; font-family: Arial, sans-serif; padding: 12px; margin: 0; background: #f9fafb; }
        h3 { margin-top: 0; color: #1f2937; font-size: 16px; }
        label { font-size: 12px; color: #4b5563; display: block; margin-top: 8px; }
        input, select, textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 8px; margin-top: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        #status { margin-top: 8px; font-size: 11px; color: #059669; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Verify Concept</h3>
    <label>Concept Name</label>
    <input type="text" id="concept_name" placeholder="e.g. Photosynthesis">

    <label>Subject</label>
    <input type="text" id="subject" placeholder="e.g. Science">

    <label>Grade Level</label>
    <input type="text" id="grade_level" placeholder="e.g. Grade 8">

    <label>Definition / Claim</label>
    <textarea id="definition" rows="3" placeholder="Paste unverified definition..."></textarea>

    <button id="submitBtn">Verify & Submit</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
