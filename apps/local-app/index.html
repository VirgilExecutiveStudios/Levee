<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Levee Local Verification Tool</title>
    <script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-gray-50 min-h-screen flex flex-col'>
    <header class='bg-white shadow'>
        <div class='container mx-auto px-6 py-4'>
            <h1 class='text-2xl font-bold text-gray-900'>Levee Local Verification Tool</h1>
        </div>
    </header>
    <main class='flex-1 container mx-auto px-6 py-4'>
        <div class='bg-white rounded-lg shadow p-6'>
            <h2 class='text-xl font-semibold text-gray-900 mb-4'>Verify a Site, Form, or Folder</h2>
            <form id='verificationForm' class='space-y-4'>
                <div>
                    <label class='block text-sm font-medium text-gray-700 mb-2'>Target Path</label>
                    <input type='text' id='targetPath' placeholder='Enter site URL, form path, or folder path...' class='w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500'>
                </div>
                <div class='flex space-x-3'>
                    <button type='submit' class='bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition flex-1'>
                        Start Verification
                    </button>
                    <button type='button' id='cancelBtn' class='bg-gray-300 text-gray-800 px-6 py-2 rounded-md hover:bg-gray-400 transition flex-1'>
                        Cancel
                    </button>
                </div>
            </form>
            <div id='status' class='mt-4 p-4 bg-gray-100 rounded-md hidden'>
                <p id='statusText' class='text-gray-700'></p>
            </div>
            <div id='results' class='mt-6 space-y-4'>
                <!-- Results will be injected here -->
            </div>
        </div>
    </main>
    <footer class='bg-white shadow'>
        <div class='container mx-auto px-6 py-4 text-center text-sm text-gray-500'>
            Levee &copy; <span id='year'></span>
        </div>
    </footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        const form = document.getElementById('verificationForm');
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const resultsDiv = document.getElementById('results');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const targetPath = document.getElementById('targetPath').value.trim();
            if (!targetPath) {
                statusText.textContent = 'Please enter a target path.';
                statusDiv.classList.remove('hidden');
                statusDiv.classList.add('bg-red-100');
                statusDiv.classList.remove('bg-green-100');
                return;
            }
            statusText.textContent = 'Starting verification...';
            statusDiv.classList.remove('hidden');
            statusDiv.classList.add('bg-blue-100');
            statusDiv.classList.remove('bg-red-100', 'bg-green-100');
            resultsDiv.innerHTML = '';
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/verify-entity', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        entity_id: 'local-app-' + Date.now(),
                        subject: 'Local App Verification',
                        grade_level: 'N/A',
                        concept_name: targetPath,
                        unverified_definition: 'Verification requested via local app',
                        callback_url: null
                    })
                });
                if (!response.ok) throw new Error('Verification request failed');
                const result = await response.json();
                statusText.textContent = 'Verification scheduled! Check the review queue for results.';
                statusDiv.classList.remove('bg-blue-100');
                statusDiv.classList.add('bg-green-100');
                resultsDiv.innerHTML = <p class='text-green-600'>Verification ID: </p><p class='text-gray-600'>Message: </p>;
            } catch (error) {
                console.error(error);
                statusText.textContent = 'Error: ' + error.message;
                statusDiv.classList.remove('bg-blue-100');
                statusDiv.classList.add('bg-red-100');
            }
        });
        
        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('targetPath').value = '';
            statusDiv.classList.add('hidden');
            resultsDiv.innerHTML = '';
        });
    </script>
</body>
</html>
