<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levee Review Queue | Human-in-the-Loop</title>|<title>Levee Review Queue | Human-in-the-Loop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Levee Verification Dashboard</h1>
            <p>Review items requiring human attention (Levee) (Confidence < 85% or Contradictory Sources)</p>
        </div>
    </header>

    <main class="container">
        <div class="actions">
            <button id="refreshBtn">Refresh Review Queue</button>
            <span id="queueCount">0 items pending review</span>
        </div>

        <div id="cardsContainer" class="cards-grid">
            <!-- Cards will be populated dynamically -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
