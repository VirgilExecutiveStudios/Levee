name: Deploy Marketing Site to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify marketing site exists
        run: |
          echo "Checking marketing site directory..."
          ls -la apps/marketing/
          echo "Checking for index.html..."
          ls -la apps/marketing/index.html || echo "index.html not found!"

      - name: Prepare site for deployment
        run: |
          echo "Creating _site directory..."
          mkdir -p _site
          echo "Copying marketing site files..."
          cp -r apps/marketing/* _site/
          echo "Contents of _site:"
          ls -la _site/
          echo "Checking for index.html in _site..."
          ls -la _site/index.html || echo "index.html not found in _site!"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
